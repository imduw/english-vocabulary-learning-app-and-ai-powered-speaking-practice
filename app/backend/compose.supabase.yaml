# Supabase development runtime only. Pass --env-file .env.supabase.local.
# Select only runtime settings; never forward migration/test-account credentials.
services:
  backend:
    build: .
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?Set runtime DATABASE_URL in the local env file}
      DATABASE_SSL: "true"
      DATABASE_CA_FILE: /app/supabase-ca.local.crt
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-3000}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the local env file}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set the publishable key for Auth routes}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OCR_ENGINE: native
      OCR_WARMUP: "true"
    volumes:
      - type: bind
        source: ./supabase-ca.local.crt
        target: /app/supabase-ca.local.crt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 3
